services:
  - type: web
    name: breathe-esg-api
    env: docker
    plan: starter
    rootDir: .
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /api/
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_ALLOWED_HOSTS
        value: "breathe-esg-api.onrender.com"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString

databases:
  - name: breathe-esg-db
    plan: starter
